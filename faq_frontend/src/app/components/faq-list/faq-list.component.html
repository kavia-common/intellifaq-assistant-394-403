<div>
  <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 10px;">
    <div style="font-weight: 700;">FAQs</div>
    <button class="btn ghost interactive" (click)="fetch()">Refresh</button>
  </div>
  <div style="display:flex; gap:8px; margin-bottom: 12px;">
    <input class="input" [(ngModel)]="q" (keyup.enter)="search()" placeholder="Search FAQs..." aria-label="Search FAQs">
    <button class="btn interactive" (click)="search()">Search</button>
  </div>
  <div *ngIf="loading()">Loading...</div>
  <ul style="list-style:none; display:flex; flex-direction:column; gap:8px; max-height: 260px; overflow:auto; padding-right: 6px;">
    <li *ngFor="let f of items()" class="interactive" style="padding:10px; border-radius:12px; border:1px solid rgba(2,6,23,0.06); background:#ffffff; display:flex; flex-direction:column; gap:6px;">
      <div style="font-weight:600; color:#0f172a;">{{ f.question }}</div>
      <div class="text-muted" style="font-size:12px; line-height:1.3;" *ngIf="f.answer">{{ f.answer }}</div>
      <div style="display:flex; gap:6px; margin-top:4px;">
        <button class="btn secondary interactive" (click)="askQuestion(f)">Ask</button>
        <span *ngIf="f.popularity" class="text-muted" style="font-size:12px;">Popularity: {{ f.popularity }}</span>
      </div>
    </li>
  </ul>
</div>
